plugins { id 'numen-plugin' }

// 森罗物语:厨房在这个 MC 版本上只有 NeoForge 版(1.1.0 起停发 Fabric),而本联动要直接
// 调它的方块实体(IPot/IStockpot)与品质评估器,编译对着 NeoForge。Fabric 上装不上森罗,
// 那边没有这个联动,也不需要有。
neoForge { version = neoforge_version }

repositories {
    // 森罗只发 CurseForge;代码 BSD-3-Clause,不混淆,所以可以直接编译依赖拿真类型。
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    // 瘦 api jar 取 NeoForge 那份:本联动本来就只跑在 NeoForge 上
    compileOnly files(project(':numen-api:neoforge').tasks.named('apiJar'))
    // 运行时由玩家自己装的那份提供;本模块不携带它一个字节,也不带任何模型/贴图/音频。
    compileOnly "curse.maven:kaleidoscope-cookery-1309203:${kaleidoscope_version}"
}

/*
 * 森罗在场时的 GameTest:用例在 src/gametest,单开一次跑(`./gradlew :plugins:kaleidoscope:runGameTestServer`)。
 *
 * 不挂进 Numen 那一次(:numen:neoforge:runGameTestServer):森罗带着自己的 mixin 与方块实体,挂上去全部用例的环境
 * 都跟着变,那一次就不再是"只有本体"的样子。这一次照成品的样子:本体、这个联动(成品 jar 里它本来就平铺在本体里)、
 * 联动的用例同在 numen 这一个模组里;森罗由运行时类路径带进来,和玩家装它一样被当成模组加载。
 *
 * 用例与 Numen 的 GameTest 共用夹具(GameTestKit)同包,在同一个模组里才看得见包内的那些,所以用例编译
 * 对着 Numen 的测试夹具(numen/common 的 src/testFixtures)的输出;Numen 自己的用例与寻路的用例不加载——它们
 * 是套件 numen(见 KaleidoscopeGameTestSuite);结构模板用 Numen 同步好的那一份目录。
 */
sourceSets {
    gametest {}
}

// 这个模块的 GameTest 会用到:本体、夹具、结构模板都在别的项目里
def numenNeoForge = project(':numen:neoforge')
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')
def kaleidoscopeSuite = rootProject.ext.numenSuites[project.path].gametest

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    mods {
        numen {
            sourceSet numenNeoForge.sourceSets.main
            sourceSet project(':numen:common').sourceSets.testFixtures
            // 寻路模块的类在成品里平铺在本体的 jar 里,这里不走 jar,同样声明
            sourceSet project(':numen:pathing').sourceSets.main
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
        // Numen API 的 GameTest 支持:套件机制与登记入口、模拟主人连接的加载器实现
        numen_api_gametest {
            sourceSet project(':numen-api:neoforge').sourceSets.gametest
            sourceSet project(':numen-api:common').sourceSets.testFixtures
        }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            ideName = "NeoForge GameTestServer (${project.path})"
            sourceSet = sourceSets.gametest
            gameDirectory = project.mkdir(project.file('runs/gametestserver'))
            // 跑哪些套件:默认是 numenSuites 表里本模块的套件;-Pgametest=(逗号分隔)覆盖
            systemProperties.put('numen.gametest.suites', providers.gradleProperty('gametest').orElse(kaleidoscopeSuite))
            // 森罗自带它自己的 GameTest,第三方模组的用例不归我们,NeoForge 的命名空间过滤只放行 numen_kaleidoscope
            systemProperty('neoforge.enabledGameTestNamespaces', 'numen_kaleidoscope')
            systemProperty('numen.gametest.structures',
                    gameTestStructures.get().asFile.absolutePath)
        }
    }
}

dependencies {
    gametestCompileOnly files({ numenNeoForge.sourceSets.main.output })
    gametestCompileOnly project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_kaleidoscope)
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、按模型的样子调工具,和 Numen 的用例一样;运行时它就是 numen_api 那个模组
    gametestImplementation project(':numen-api:neoforge')
    // 用例直接调本联动的 Cooker/Dish;本模块主源码集与用例同在一次跑批里
    gametestImplementation sourceSets.main.output
    // 跑批时森罗由这里进运行时类路径,和玩家装它一样
    gametestImplementation "curse.maven:kaleidoscope-cookery-1309203:${kaleidoscope_version}"
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:neoforge:classes', ':numen:common:testFixturesClasses'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn ':numen:neoforge:classes', ':numen-api:neoforge:gametestClasses', ':numen:common:syncGameTestStructures',
            ':numen:common:testFixturesClasses', ':numen-api:common:testFixturesClasses'
}
