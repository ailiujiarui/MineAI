plugins { id 'numen-plugin' }

// Mekanism 在这个 MC 版本上是 NeoForge 版:对着 NeoForge + Mekanism 的公开 API 编译。
neoForge { version = neoforge_version }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // 瘦 api jar 取 NeoForge 那份:本联动只跑在 NeoForge 上
    compileOnly files(project(':api:neoforge').tasks.named('apiJar'))
    // 只对着 Mekanism 的公开 API 编译;运行时由玩家自己装的那份提供,本模块不携带它一个字节。
    compileOnly 'maven.modrinth:mekanism:10.7.19.85'
}
