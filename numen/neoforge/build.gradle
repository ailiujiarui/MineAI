plugins {
    id 'numen-loader'
    id 'net.neoforged.moddev'
}

// 独立实验只在显式启动时装载,不进发行 jar。
sourceSets {
    experiment {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// 要读 Numen 的 gametest 与 testFixtures 源码集、Numen API 的开发期 gametest 源码集,它们得先配置好
evaluationDependsOn(':numen:common')
evaluationDependsOn(':numen-api:neoforge')
// 联动模块的源码集也要读(见下面 mods 块),它们同样得先配置好
evaluationDependsOn(':plugins:ysm')
evaluationDependsOn(':plugins:tlm')
evaluationDependsOn(':plugins:kaleidoscope')
evaluationDependsOn(':plugins:curios')
evaluationDependsOn(':plugins:ftbquests')
evaluationDependsOn(':plugins:ae2')
evaluationDependsOn(':plugins:mekanism')
evaluationDependsOn(':plugins:jei')
evaluationDependsOn(':plugins:twilightforest')

dependencies {
    // Numen API 同在本构建里。编译期看不见它的内部类(见 numen-loader.gradle),运行与数据生成要它在类路径上,
    // 所以是 runtimeOnly:POM 里落成运行期依赖,玩家装 Numen 就带上它。
    runtimeOnly project(':numen-api:neoforge')

    // 内嵌的联动模组。compileOnly:只有 Builtin 那道闸要看见它们的 install 入口,
    // 类与资源由下面的 jar 块平铺进发行 jar,不作为独立依赖出现在 POM 里
    // (它们不发布——没人需要依赖我们的联动代码)。
    compileOnly project(':plugins:ysm')
    compileOnly project(':plugins:tlm')
    compileOnly project(':plugins:kaleidoscope')
    compileOnly project(':plugins:curios')
    compileOnly project(':plugins:ftbquests')
    compileOnly project(':plugins:ae2')
    compileOnly project(':plugins:mekanism')
    compileOnly project(':plugins:jei')
    compileOnly project(':plugins:twilightforest')
    // 评测 GameTest(在本模块 src/main,不进发行 jar):用 Numen 的 GameTestKit 夹具
    compileOnly project(':numen:common').sourceSets.testFixtures.output
    // Bundle it into Numen's jar (Jar-in-Jar) so players install one file and get both mods.
    jarJar(project(':numen-api:neoforge'))
}

/*
 * GameTest:用例在 numen/common 与 numen/pathing 的 gametest 里,只用原版,经套件报到;这里只把它们的输出声明进模组 numen(见下面的
 * mods)。加载器这一层的支持(登记套件入口、模拟主人连接的频道配法)属于 Numen API,在 numen-api/neoforge 的开发期小模组
 * numen_api_gametest 里,这里把它声明进运行配置。用例与夹具不进发行 jar:jar 只收 main 的输出。
 */

// 这一次 GameTest 跑批带的有用例的模块,和它们的套件名(模块与套件名的对应在根 build.gradle 的 numenSuites 表里)。联动的 GameTest
// 另开一次(它们的构建脚本里),不带这两个模块的用例。
def gameTestModules = rootProject.ext.numenGameTestModules.collect { project(it) }
def gameTestSuites = gameTestModules.collect { rootProject.ext.numenSuites[it.path].gametest }
// 跑哪些套件:默认是这一次带的全部;-Pgametest=numen_pathing(逗号分隔)只跑指定的。没给 numen.gametest.suites 就一个套件都不登记
// (评测的运行配置就不给,见 numen-bench.gradle)
def gameTestSelection = providers.gradleProperty('gametest').orElse(gameTestSuites.join(','))

def gameTestSeed = providers.gradleProperty('gametestSeed')

// GameTest 的结构模板:同步进 numen/common 的构建目录里的一处(见那边的 syncGameTestStructures),运行配置指向它。
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.experiment)
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':numen:common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            // 所有运行配置都指向同步好的 SNBT 模板目录(见 numen/common 的 syncGameTestStructures):无头跑批用,开发客户端里
            // /test run <用例> 现场围观也用(见 GameTestSuites)。
            systemProperty('numen.gametest.structures', gameTestStructures.get().asFile.absolutePath)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            systemProperties.put('numen.gametest.suites', gameTestSelection)
            if (providers.gradleProperty('numenLiveEval').isPresent()) {
                if (!providers.gradleProperty('numenLiveEvalGameDir').isPresent()) {
                    throw new GradleException('numenLiveEval requires an isolated numenLiveEvalGameDir')
                }
                systemProperty('numen.eval.live', providers.gradleProperty('numenLiveEval').get())
                gameDirectory = this.mkdir(this.file(providers.gradleProperty('numenLiveEvalGameDir').get()))
            } else {
                gameDirectory = this.mkdir(this.file("runs/client"))
            }
        }
        data {
            data() // NeoForge 21.1 (1.21.1) has no clientData() run type — the combined data() run + --all covers it
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperties.put('numen.gametest.suites', gameTestSelection)
            // 真实地形维度的种子(-PgametestSeed=…):没给就是原版 GameTest 服务器写死的 0
            if (gameTestSeed.present) {
                systemProperties.put('numen.gametest.seed', gameTestSeed.get())
            }
            rootProject.ext.numenTerrainProperties().each { key, value -> systemProperties.put(key, value) }
            gameDirectory = this.mkdir(this.file("runs/gametestserver"))
            if (providers.gradleProperty('numenEvalOutput').isPresent()) {
                systemProperty('numen.eval.output', providers.gradleProperty('numenEvalOutput').get())
            }
        }
        if (project.hasProperty('pairedExperiment')) {
            pairedExperiment {
                server()
                sourceSet = sourceSets.experiment
                gameDirectory = file(project.property('experimentDirectory'))
                systemProperty('numen.experiment.request', file(project.property('experimentRequest')).absolutePath)
                systemProperty('neoforge.enabledGameTestNamespaces', 'numen_experiment')
            }
        }
        if (project.hasProperty('supplementalMeasurements')) {
            supplementalMeasurements {
                server()
                sourceSet = sourceSets.experiment
                gameDirectory = file(project.property('measurementDirectory'))
                systemProperty('numen.measurement.request', file(project.property('measurementRequest')).absolutePath)
                systemProperty('neoforge.enabledGameTestNamespaces', 'numen_experiment')
            }
        }
    }
    mods {
        if (project.hasProperty('pairedExperiment') || project.hasProperty('supplementalMeasurements')) {
            numen_experiment { sourceSet sourceSets.experiment }
        }
        "${mod_id}" {
            sourceSet sourceSets.main
            // 寻路模块的类平铺进发行 jar(见 numen-loader.gradle),开发期的运行不走那个 jar,在这里同样声明
            sourceSet project(':numen:pathing').sourceSets.main
            // 内嵌联动的类与资源接上同一份(成品 jar 里它们也平铺在本体里,见下方 jar 块):开发运行不读
            // 成品 jar,不这样接 Builtin 一引用联动类就 NoClassDefFoundError,ModJar.find 也找不到它带的技能
            sourceSet project(':plugins:ysm').sourceSets.main
            sourceSet project(':plugins:tlm').sourceSets.main
            sourceSet project(':plugins:kaleidoscope').sourceSets.main
            sourceSet project(':plugins:curios').sourceSets.main
            sourceSet project(':plugins:ftbquests').sourceSets.main
            sourceSet project(':plugins:ae2').sourceSets.main
            sourceSet project(':plugins:mekanism').sourceSets.main
            sourceSet project(':plugins:jei').sourceSets.main
            sourceSet project(':plugins:twilightforest').sourceSets.main
            // Numen 的夹具:只含原版类;是联动的 GameTest 也用的那一份
            sourceSet project(':numen:common').sourceSets.testFixtures
            // 各模块的用例
            gameTestModules.each { sourceSet it.sourceSets.gametest }
        }
        // Numen API 的 GameTest 支持:套件机制与登记入口、模拟主人连接的加载器实现(都不属于 Numen,别的运行配置也这样声明)
        numen_api_gametest {
            sourceSet project(':numen-api:neoforge').sourceSets.gametest
            sourceSet project(':numen-api:common').sourceSets.testFixtures
        }
    }
}

tasks.matching { it.name ==~ /run[A-Z].*/ }.configureEach {
    dependsOn ':numen:common:syncGameTestStructures'
    dependsOn ':numen-api:neoforge:gametestClasses', ':numen-api:common:testFixturesClasses', ':numen:common:testFixturesClasses'
    gameTestModules.each { dependsOn "${it.path}:gametestClasses" }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// NeoForge discovers and initializes GameTest classes in every development client.
// Their static fixture registration must not become part of the real-model tool set.
// Normal development and runGameTestServer still compile and discover every test.
if (providers.gradleProperty('numenLiveEval').isPresent()) {
    sourceSets.main.java.exclude('com/dwinovo/numen/gametest/**')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// 联动模组的类与资源平铺进发行 jar——它们本质是独立模组,只是跟车一起发。
// 目标模组不在时它们一个类都不会被加载,见 com.dwinovo.numen.plugins.Builtin。
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ project(':plugins:ysm').sourceSets.main.output })
    from({ project(':plugins:tlm').sourceSets.main.output })
    from({ project(':plugins:kaleidoscope').sourceSets.main.output })
    from({ project(':plugins:curios').sourceSets.main.output })
    from({ project(':plugins:ftbquests').sourceSets.main.output })
    from({ project(':plugins:ae2').sourceSets.main.output })
    from({ project(':plugins:mekanism').sourceSets.main.output })
    from({ project(':plugins:jei').sourceSets.main.output })
    from({ project(':plugins:twilightforest').sourceSets.main.output })
}

// 跟车发的联动,它们的防漂移测试(技能与命令说明按命令树读一遍)随本模块的 check 一起跑:构建发行 jar 就查过它带上的文字
tasks.named('check') {
    dependsOn(':plugins:ysm:test', ':plugins:tlm:test', ':plugins:kaleidoscope:test', ':plugins:ftbquests:test')
}

// 真模型评测:Numen 的考题在 numen/common 的 src/bench,:numen:neoforge:runBench 跑它们(见 buildSrc 的 numen-bench.gradle 与 docs/bench.md)。
// 放在末尾:它要用到上面定义好的模组 numen。
ext.benchModules = [project(':numen:common')]
apply plugin: 'numen-bench'
