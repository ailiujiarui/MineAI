name: Bench metrics

# 评测指标的回归门。跑的是纯 JVM 的聚合器与仓库里带的夹具(bench/fixtures/sample):不联网、不调模型、
# 不起游戏,所以能在 CI 上跑。真的模型成绩另有 runBench 在本地跑,不在这里。
#
# 五项门指标(成功率、pass^k、命令出错率、轮数、墙钟)有一项越过 bench/metrics-thresholds.json 的门槛,
# :bench:metricGate 就以非零退出,这一步失败。三项新指标(打断恢复、征询成本、自我纠正)只报,不卡。
#
# 只挂本分支:每条版本分支守自己那条。数值口径见 docs/bench.md 的指标一节。

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

concurrency:
  group: bench-metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read target JDK from gradle.properties
        id: props
        shell: bash
        run: |
          echo "java_version=$(grep -E '^java_version=' gradle.properties | head -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Setup Java ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 聚合器的单测:夹具的八项数字与三项新指标的算法。
      - name: Run bench unit tests
        run: ./gradlew :bench:test --no-daemon

      # 指标门:五项有一样越界就退出码非零,这一步失败。
      - name: Run metric gate
        run: ./gradlew :bench:metricGate --no-daemon
